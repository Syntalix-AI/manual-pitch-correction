name: CI + Deploy — dev

# ─── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - dev

# Cancel any in-progress run for the same branch so deploys don't race
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1 — Validate the backend Docker image builds cleanly
  # ───────────────────────────────────────────────────────────────────────────
  backend-build:
    name: 🐍 Backend — Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          tags: pitch-correction-backend:ci

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2 — TypeScript type-check + frontend Docker build
  # ───────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: ⚛️  Frontend — Type-check & Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image (production)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          tags: pitch-correction-frontend:ci

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3 — Validate docker-compose.yml is well-formed
  # ───────────────────────────────────────────────────────────────────────────
  compose-lint:
    name: 🐳 docker-compose.yml — Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose config --quiet

  # ───────────────────────────────────────────────────────────────────────────
  # Job 4 — Deploy to EC2 (only runs when ALL CI jobs pass)
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - frontend-build
      - compose-lint
    environment: dev   # set protection rules (e.g. manual approval) here in GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Write the SSH private key to disk ──────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ── Quick connectivity check before attempting deploy ───────────────────
      - name: Test SSH connection
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              "${EC2_USER}@${EC2_HOST}" \
              "echo SSH OK"

      # ── SSH into EC2 and run deploy.sh ─────────────────────────────────────
      - name: Deploy on EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          APP_DIR:  ${{ secrets.EC2_APP_DIR }}
        run: |
          echo "→ Deploying to ${EC2_USER}@${EC2_HOST}:${APP_DIR}"
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              "${EC2_USER}@${EC2_HOST}" \
              "cd ${APP_DIR} && BRANCH=dev ./deploy.sh"

      # ── Smoke test — frontend (port 3000 → nginx :80 inside container) ─────
      - name: Smoke test — frontend reachable
        run: |
          echo "Checking http://${{ secrets.EC2_HOST }}:3000/ ..."
          for i in $(seq 1 10); do
            STATUS=$(curl -o /dev/null -sw "%{http_code}" \
              --max-time 5 \
              "http://${{ secrets.EC2_HOST }}:3000/" || true)
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ Frontend returned HTTP 200"
              exit 0
            fi
            echo "Attempt $i — got HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "❌ Frontend did not return 200 after 50s"
          exit 1

      # ── Smoke test — backend FastAPI docs ──────────────────────────────────
      - name: Smoke test — backend /docs reachable
        run: |
          echo "Checking http://${{ secrets.EC2_HOST }}:8000/docs ..."
          for i in $(seq 1 10); do
            STATUS=$(curl -o /dev/null -sw "%{http_code}" \
              --max-time 5 \
              "http://${{ secrets.EC2_HOST }}:8000/docs" || true)
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ Backend returned HTTP 200"
              exit 0
            fi
            echo "Attempt $i — got HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "❌ Backend did not return 200 after 50s"
          exit 1

      # ── Job summary — success ──────────────────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          echo "### 🚀 Deployment succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`dev\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **App** | http://${{ secrets.EC2_HOST }}:3000 |" >> $GITHUB_STEP_SUMMARY
          echo "| **API docs** | http://${{ secrets.EC2_HOST }}:8000/docs |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

      # ── Job summary — failure ──────────────────────────────────────────────
      - name: Deployment failed summary
        if: failure()
        run: |
          echo "### ❌ Deployment failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\` — check the logs above." >> $GITHUB_STEP_SUMMARY
